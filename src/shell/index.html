<!doctype html>
<html lang="en" data-theme="redwood">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Arbol Browser</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="control.js"></script>
</head>
<body>
  <header class="toolbar" aria-label="Browser toolbar">
    <div class="history">
      <button id="back" class="icon" aria-label="Back" title="Back"><span aria-hidden="true">←</span></button>
      <button id="forward" class="icon" aria-label="Forward" title="Forward"><span aria-hidden="true">→</span></button>
      <button id="reload" class="icon" aria-label="Reload" title="Reload"><span aria-hidden="true">↻</span></button>
    </div>
    <form id="navigate">
      <input id="address" type="text" inputmode="url" aria-label="Address" autocomplete="off" spellcheck="false" placeholder="Enter address">
    </form>
  </header>
  <aside class="rail" aria-label="Browser navigation">
    <div class="rail-heading">
      <h1>Profiles</h1>
      <button id="new" class="icon" aria-label="New tab" title="New tab">+</button>
    </div>
    <nav id="profiles" aria-label="Browser profiles">
      <div id="profile-list"></div>
      <div id="tabs" class="tabs" role="group" aria-label="Open tabs"></div>
    </nav>
    <p id="state" role="status" aria-live="polite"></p>
    <p id="problem" role="alert"></p>
    <details id="tab-actions" hidden>
      <summary>Tab actions</summary>
      <div class="actions">
        <select id="client" aria-label="Agent" hidden></select>
        <button id="share" hidden>Share</button>
        <button id="return" hidden>Return control</button>
        <button id="take" hidden>Take control</button>
        <button id="recover" hidden>Recover page</button>
        <div id="grants" class="actions" aria-label="Sharing permissions"></div>
        <div id="recovery-confirmation" hidden>
          <p>Recovery discards unsaved page state.</p>
          <button id="recover-confirm">Recover page</button>
          <button id="recover-cancel">Cancel</button>
        </div>
      </div>
    </details>
    <p id="profile-status" role="status" aria-live="polite"></p>
  </aside>
</body>
</html>
